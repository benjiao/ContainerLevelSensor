esphome:
  name: catfood-monitor
  friendly_name: Catfood Monitor
  on_boot:
    priority: -10
    then:
      - delay: 70s
      - if:
          condition:
            binary_sensor.is_off: keep_awake
          then:
            - deep_sleep.enter: ds

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "your-api-encryption-key"

ota:
  - platform: esphome
    password: "your-ota-password"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Catfood-Monitor Fallback Hotspot"
    password: "make-your-own-captive-portal-password"

captive_portal:
i2c:
  sda: GPIO04
  scl: GPIO05
  scan: true
  id: bus_a

binary_sensor:
  - platform: gpio
    id: keep_awake
    name: "Keep Awake Jumper"
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      
deep_sleep:
  id: ds
  sleep_duration: 1h
sensor:
  - platform: vl53l0x
    id: sensor_distance
    name: "VL53L0x Distance"
    address: 0x29
    long_range: true
    update_interval: 15s
    
  - platform: template
    name: "Level"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      static float bottom_distance = 0.52;
      static float top_offset = 0.1;
      float dist = id(sensor_distance).state;

      if (isnan(dist)) {
        return NAN;
      }

      float value = 100.0f * (1.0f - (dist - top_offset) / (bottom_distance - top_offset));
      return min(100.0f, max(0.0f, value));
